<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Walkie-Talkie</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1e1e24, #2a2b36);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
        }

        /* Walkie Talkie Body */
        .walkie-talkie {
            background: #2b2d42;
            width: 280px;
            height: 500px;
            border-radius: 40px 40px 30px 30px;
            position: relative;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5), inset 0 2px 5px rgba(255,255,255,0.2);
            border: 4px solid #1d1e2c;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        /* Antenna */
        .antenna {
            width: 24px;
            height: 60px;
            background: #1d1e2c;
            position: absolute;
            top: -55px;
            left: 50px;
            border-radius: 5px 5px 0 0;
        }
        .antenna::after {
            content: '';
            width: 32px;
            height: 12px;
            background: #ef233c;
            position: absolute;
            top: -10px;
            left: -4px;
            border-radius: 5px;
        }

        /* Volume Knob */
        .knob {
            width: 35px;
            height: 20px;
            background: #1d1e2c;
            position: absolute;
            top: -16px;
            right: 60px;
            border-radius: 4px 4px 0 0;
        }

        /* Speaker Grille */
        .speaker-grille {
            width: 100%;
            height: 100px;
            background: #1f2029;
            margin-top: 20px;
            border-radius: 15px;
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            padding: 15px 25px;
            border: 2px solid #15161e;
        }

        .grille-line {
            height: 6px;
            background: #3d405b;
            border-radius: 3px;
        }

        /* Screen / Status Indicator */
        .screen {
            width: 100%;
            background: #8ecae6;
            height: 80px;
            margin-top: 20px;
            border-radius: 10px;
            border: 3px solid #1d1e2c;
            padding: 10px;
            color: #023047;
            font-weight: bold;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-shadow: 0 1px 1px rgba(255,255,255,0.5);
            font-family: monospace;
        }

        .channel {
            font-size: 1.2rem;
            letter-spacing: 2px;
        }

        .status-text {
            font-size: 0.9rem;
            margin-top: 5px;
            text-transform: uppercase;
            animation: blink 1.5s infinite;
        }

        /* LED Indicator */
        .led {
            width: 12px;
            height: 12px;
            background: #4caf50;
            border-radius: 50%;
            position: absolute;
            top: 25px;
            right: 30px;
            box-shadow: 0 0 10px #4caf50;
            transition: background 0.3s;
        }

        /* PTT Button (Push To Talk) */
        .ptt-button {
            width: 140px;
            height: 140px;
            background: radial-gradient(circle, #ef233c, #d90429);
            border: 6px solid #1d1e2c;
            border-radius: 50%;
            margin-top: auto;
            margin-bottom: 20px;
            cursor: pointer;
            box-shadow: 0 10px 0 #8d0801, 0 15px 20px rgba(0,0,0,0.4);
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 1.3rem;
            letter-spacing: 1px;
            user-select: none;
            transition: all 0.1s ease;
        }

        .ptt-button:active {
            transform: translateY(8px);
            box-shadow: 0 2px 0 #8d0801, 0 5px 10px rgba(0,0,0,0.4);
        }

        /* Status Classes for JS */
        .recording {
            background: #d90429 !important;
            box-shadow: 0 0 20px #d90429 !important;
        }

        .playing {
            background: #ffb703 !important;
            box-shadow: 0 0 20px #ffb703 !important;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }
    </style>
</head>
<body>

    <div class="walkie-talkie">
        <div class="antenna"></div>
        <div class="knob"></div>
        <div class="led" id="led"></div>

        <div class="speaker-grille">
            <div class="grille-line"></div>
            <div class="grille-line"></div>
            <div class="grille-line"></div>
            <div class="grille-line"></div>
        </div>

        <div class="screen">
            <div class="channel">CH-01 ONLINE</div>
            <div class="status-text" id="status-text">READY</div>
        </div>

        <div class="ptt-button" id="ptt-btn">PUSH</div>
    </div>

    <script>
        const pttBtn = document.getElementById('ptt-btn');
        const statusText = document.getElementById('status-text');
        const led = document.getElementById('led');

        let mediaRecorder;
        let audioChunks = [];
        let audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        // ১. ওয়াকি-টকির আসল "বিপ" (Beep) সাউন্ড তৈরি করার ফাংশন
        function playBeep(frequency, duration, callback) {
            let oscillator = audioCtx.createOscillator();
            let gainNode = audioCtx.createGain();
            
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            oscillator.type = 'sine';
            oscillator.frequency.value = frequency; 
            
            gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
            // শেষ হওয়ার সময় হালকা ফেইড আউট
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
            
            oscillator.start();
            oscillator.stop(audioCtx.currentTime + duration);
            
            if (callback) {
                setTimeout(callback, duration * 1000);
            }
        }

        // ২. মাইক্রোফোন অ্যাক্সেস নেওয়া
        navigator.mediaDevices.getUserMedia({ audio: true })
            .then(stream => {
                mediaRecorder = new MediaRecorder(stream);

                mediaRecorder.ondataavailable = event => {
                    audioChunks.push(event.data);
                };

                mediaRecorder.onstop = () => {
                    // কথা বলা শেষ হলে টেইল বিপ (Roger Beep) বাজবে এবং তারপর অডিও প্লে হবে
                    playBeep(440, 0.15, () => {
                        playRecordedAudio();
                    });
                };
            })
            .catch(err => {
                alert("মাইক্রোফোন অ্যাক্সেস প্রয়োজন! দয়া করে পারমিশন দিন।");
                statusText.innerText = "ERROR";
            });

        // ৩. রেকর্ড করা অডিও ওয়াকি-টকি স্টাইলে প্লে করা
        function playRecordedAudio() {
            const audioBlob = new Blob(audioChunks, { type: 'audio/wav' });
            const audioUrl = URL.createObjectURL(audioBlob);
            const audio = new Audio(audioUrl);

            // প্লে হওয়ার সময় ইন্টারফেস পরিবর্তন
            statusText.innerText = "RECEIVING...";
            led.className = "led playing";

            audio.play();

            audio.onended = () => {
                statusText.innerText = "READY";
                led.className = "led";
                audioChunks = []; // পরবর্তী রেকর্ডিংয়ের জন্য ক্লিয়ার
            };
        }

        // ৪. মাউস/টাচ ইভেন্ট হ্যান্ডলার (Push To Talk)
        
        // কথা বলা শুরু (বাটন টিপে ধরে রাখলে)
        function startTalking() {
            if (!mediaRecorder || mediaRecorder.state === "recording") return;
            
            // শুরুতেই একটা রজার বিপ হবে, তারপর রেকর্ডিং শুরু হবে
            playBeep(880, 0.1, () => {
                audioChunks = [];
                mediaRecorder.start();
                statusText.innerText = "TRANSMITTING...";
                led.className = "led recording";
            });
        }

        // কথা বলা শেষ (বাটন ছেড়ে দিলে)
        function stopTalking() {
            if (mediaRecorder && mediaRecorder.state === "recording") {
                mediaRecorder.stop();
            }
        }

        // ডেক্সটপ এর জন্য (Mouse Events)
        pttBtn.addEventListener('mousedown', startTalking);
        window.addEventListener('mouseup', stopTalking);

        // মোবাইল বা টাচ স্ক্রিনের জন্য (Touch Events)
        pttBtn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            startTalking();
        });
        window.addEventListener('touchend', stopTalking);

    </script>
</body>
</html>
